<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: draw under the notch / home indicator; the app pads with the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Installed on the home screen ("Add to Home Screen") it opens full screen like an app. -->
    <meta name="theme-color" content="#1C1C1A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LiftLog" />
    <link rel="apple-touch-icon" href="/MyGym/apple-touch-icon.png" />
    <link rel="manifest" href="/MyGym/manifest.json" />

    <!-- Color themes. Values are generated from src/theme/tokens.ts; tests/theme.test.ts keeps them equal. -->
    <style id="liftlog-theme">
      :root { --c-bg: #1C1C1A; --c-surface: #272724; --c-surface2: #32322E; --c-ink: #F2F0EA; --c-muted: #A39F96; --c-line: rgba(242,240,234,0.13); --c-border: rgba(242,240,234,0.26); --c-accent: #F2B92A; --c-accent-fill: #F2B92A; --c-accent-ink: #1C1C1A; --c-press: #D9A41F; --c-red: #FF6A4D; --c-green: #3DDC84; --c-placeholder: #6E6A63; --c-scrim: rgba(28,28,26,0.72); --c-on-plate: #1C1C1A; --c-plate-d: #E9E6DF; --c-plate-h: #C7C2B8; }
      :root[data-theme="light"] { --c-bg: #F4F2EC; --c-surface: #E7E3DA; --c-surface2: #DAD5CA; --c-ink: #1C1C1A; --c-muted: #5E5A52; --c-line: rgba(28,28,26,0.12); --c-border: rgba(28,28,26,0.28); --c-accent: #7A5800; --c-accent-fill: #F2B92A; --c-accent-ink: #1C1C1A; --c-press: #D9A41F; --c-red: #B8391F; --c-green: #187241; --c-placeholder: #8C877E; --c-scrim: rgba(28,28,26,0.72); --c-on-plate: #1C1C1A; --c-plate-d: #B5B0A6; --c-plate-h: #A39E93; }
      @media (prefers-color-scheme: light) {
        :root[data-theme="auto"] { --c-bg: #F4F2EC; --c-surface: #E7E3DA; --c-surface2: #DAD5CA; --c-ink: #1C1C1A; --c-muted: #5E5A52; --c-line: rgba(28,28,26,0.12); --c-border: rgba(28,28,26,0.28); --c-accent: #7A5800; --c-accent-fill: #F2B92A; --c-accent-ink: #1C1C1A; --c-press: #D9A41F; --c-red: #B8391F; --c-green: #187241; --c-placeholder: #8C877E; --c-scrim: rgba(28,28,26,0.72); --c-on-plate: #1C1C1A; --c-plate-d: #B5B0A6; --c-plate-h: #A39E93; }
      }
      /* Photo sections (heroes) stay dark in both themes. */
      [data-scope="dark"] { --c-bg: #1C1C1A; --c-surface: #272724; --c-surface2: #32322E; --c-ink: #F2F0EA; --c-muted: #A39F96; --c-line: rgba(242,240,234,0.13); --c-border: rgba(242,240,234,0.26); --c-accent: #F2B92A; --c-accent-fill: #F2B92A; --c-accent-ink: #1C1C1A; --c-press: #D9A41F; --c-red: #FF6A4D; --c-green: #3DDC84; --c-placeholder: #6E6A63; --c-scrim: rgba(28,28,26,0.72); --c-on-plate: #1C1C1A; --c-plate-d: #E9E6DF; --c-plate-h: #C7C2B8; }
    </style>
    <!-- Applies the saved theme before the app draws, so there is no flash.
         iOS reads the status bar style when the home-screen app opens: light text
         over the page in dark mode, dark text on a light bar in light mode. -->
    <script>
      (function () {
        var pref = 'auto';
        try { pref = localStorage.getItem('liftlog-theme') || 'auto'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'auto' && !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
        document.documentElement.setAttribute('data-theme', pref);
        var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (bar) bar.setAttribute('content', dark ? 'black-translucent' : 'default');
        var tint = document.querySelector('meta[name="theme-color"]');
        if (tint) tint.setAttribute('content', dark ? '#1C1C1A' : '#F4F2EC');
      })();
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: var(--c-bg);
        /* No rubber-band bounce or pull-to-refresh: the app scrolls inside its own views. */
        overscroll-behavior: none;
        /* Fast taps on +/− steppers must not zoom the page (pinch zoom still works). */
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
